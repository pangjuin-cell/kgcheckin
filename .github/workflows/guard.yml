name: CheckinGuard

on:
  schedule:
    - cron: '47 0 * * *'
    - cron: '23 2 * * *'
    - cron: '37 4 * * *'
    - cron: '53 6 * * *'
    - cron: '13 10 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check today status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_ID: '314818558'
        run: |
          set -uo pipefail
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "BEIJING_TODAY=$TODAY"

          HTTP=$(curl -sS -o resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_ID}/runs?per_page=50")
          echo "API_HTTP=$HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "::warning::query failed (HTTP $HTTP), triggering anyway"
            exit 0
          fi

          RESULT=$(python3 - "$TODAY" <<'PYEOF'
import sys, json
from datetime import datetime, timedelta, timezone

today = sys.argv[1]
cst = timezone(timedelta(hours=8))
ok = pending = 0
with open('resp.json', encoding='utf-8') as f:
    data = json.load(f)
for r in data.get('workflow_runs', []):
    ts = datetime.strptime(r['created_at'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc).astimezone(cst)
    if ts.strftime('%Y-%m-%d') != today:
        continue
    if r.get('status') != 'completed':
        pending += 1
    elif r.get('conclusion') == 'success':
        ok += 1
print(ok, pending)
PYEOF
)
          OK_COUNT=$(echo "$RESULT" | awk '{print $1}')
          PENDING=$(echo "$RESULT" | awk '{print $2}')
          echo "SUCCESS_TODAY=$OK_COUNT PENDING=$PENDING"

          if [ "$OK_COUNT" -gt 0 ]; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "already signed today, skip"
          elif [ "$PENDING" -gt 0 ]; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "signin in progress, skip"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "no success today, triggering"
          fi

      - name: Trigger signin
        if: steps.check.outputs.need == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_ID: '314818558'
        run: |
          set -uo pipefail
          CODE=$(curl -sS -o disp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_ID}/dispatches")
          echo "dispatch HTTP $CODE"
          if [ "$CODE" != "204" ]; then
            cat disp.json || true
            echo "::error::trigger failed HTTP $CODE"
            exit 1
          fi
          echo "triggered OK"
